---
name: Ratchet Update

on:
  schedule:
    - cron: '42 3 17 * *' # 03:42 UTC on the 17th of every month
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Update pinned actions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          persist-credentials: false
      - run: make ratchet-update-all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # ratchet:peter-evans/create-pull-request@v7
        with:
          commit-message: "deps(ci): update pinned GitHub Actions to latest SHAs"
          committer: kuadrant-dev <kuadrant-dev@redhat.com>
          author: kuadrant-dev <kuadrant-dev@redhat.com>
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          signoff: true
          sign-commits: true
          base: main
          branch: chore/ratchet-update
          delete-branch: true
          title: "deps(ci): update pinned GitHub Actions to latest SHAs"
          body: |
            Automated monthly update of pinned GitHub Actions references.

            Auto-generated by [ratchet-update](https://github.com/Kuadrant/limitador/actions/workflows/ratchet-update.yaml)
          labels: dependencies
